<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather</title>
<link rel="preconnect" href="https://commons.wikimedia.org">
<link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<style>
  :root{--sky1:#2b5876;--sky2:#4e4376;--ink:#fff;--glass:rgba(255,255,255,.14);--line:rgba(255,255,255,.22)}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);padding:24px 16px 48px;background:#1b2433}
  #bg{position:fixed;inset:0;z-index:-2;background:center/cover no-repeat;opacity:0;transition:opacity .6s}
  #bg.on{opacity:1}
  body::before{content:"";position:fixed;inset:0;z-index:-1;opacity:.62;background:linear-gradient(160deg,var(--sky1),var(--sky2));transition:background .8s}
  main{max-width:520px;margin:0 auto}
  form{display:flex;gap:8px;margin-bottom:8px}
  input{flex:1;min-width:0;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font-size:1rem;outline:none}
  input::placeholder{color:rgba(255,255,255,.65)}
  button{padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font-size:1rem;cursor:pointer}
  button:hover{background:rgba(255,255,255,.24)}
  input:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  #msg{min-height:1.4em;font-size:.9rem;opacity:.85;margin:0 8px 8px}
  #recent{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
  #recent button{padding:6px 12px;font-size:.8rem}
  .now{text-align:center;padding:8px 0 20px}
  .icon{font-size:5rem;line-height:1}
  .temp{font-size:5.5rem;font-weight:200;line-height:1.1}
  .city{font-size:1.4rem}
  .sub{opacity:.8;font-size:.85rem;margin-top:2px}
  .desc{opacity:.9;margin-top:4px}
  .tip{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:.95rem}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
  .stat{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
  .stat b{display:block;font-size:1.05rem;font-weight:600}
  .stat span{font-size:.78rem;opacity:.8}
  h2{font-size:1rem;font-weight:600;margin:0 4px 8px}
  .hours{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:20px}
  .hour{flex:0 0 64px;text-align:center;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px 4px}
  .hour div:first-child{font-size:.8rem;opacity:.8}
  .hour div:nth-child(2){font-size:1.5rem;margin:4px 0}
  .days{background:var(--glass);border:1px solid var(--line);border-radius:14px}
  .day{display:grid;grid-template-columns:60px 36px 1fr auto;gap:8px;align-items:center;padding:10px 14px}
  .day+.day{border-top:1px solid var(--line)}
  .lo{opacity:.7}.rain{font-size:.8rem;opacity:.8}
  .credit{text-align:center;font-size:.72rem;opacity:.7;margin-top:24px}
  .credit a{color:inherit}
  [hidden]{display:none}
  @media (prefers-reduced-motion:reduce){#bg,body::before{transition:none}}
</style>
</head>
<body>
<div id="bg"></div>
<main>
  <form id="f" autocomplete="off">
    <input id="q" list="sugg" placeholder="Search city (e.g. Mangaluru)" aria-label="City">
    <datalist id="sugg"></datalist>
    <button type="submit">Search</button>
    <button type="button" id="loc" title="Use my location" aria-label="Use my location">📍</button>
    <button type="button" id="unit" title="Switch units" aria-label="Switch units"></button>
  </form>
  <p id="msg" role="status"></p>
  <div id="recent"></div>

  <section id="out" hidden>
    <div class="now">
      <div class="city" id="city"></div>
      <div class="sub" id="local"></div>
      <div class="icon" id="icon"></div>
      <div class="temp" id="temp"></div>
      <div class="desc" id="desc"></div>
    </div>
    <div class="tip" id="tip"></div>
    <div class="stats">
      <div class="stat"><b id="feels"></b><span>Feels like</span></div>
      <div class="stat"><b id="hum"></b><span>Humidity</span></div>
      <div class="stat"><b id="wind"></b><span>Wind</span></div>
      <div class="stat"><b id="uv"></b><span>UV index</span></div>
      <div class="stat"><b id="aqi"></b><span>Air quality</span></div>
      <div class="stat"><b id="sun"></b><span>Sunrise / sunset</span></div>
    </div>
    <h2>Next 24 hours</h2>
    <div class="hours" id="hours"></div>
    <h2>7-day forecast</h2>
    <div class="days" id="days"></div>
  </section>
  <p class="credit" id="credit"></p>
</main>

<script>
const $ = id => document.getElementById(id);
const msg = t => $("msg").textContent = t;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
async function getJSON(url, ms = 8000){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try{
    const r = await fetch(url, {signal: ctl.signal});
    if(!r.ok) throw new Error("Network error " + r.status);
    return await r.json();
  }finally{ clearTimeout(t); }
}

/* ---------------- Weather codes ---------------- */
const WX = {
  0:["☀️","Clear sky",["#2193b0","#6dd5ed"]],1:["🌤️","Mostly clear",["#2193b0","#6dd5ed"]],
  2:["⛅","Partly cloudy",["#556270","#8aa4b8"]],3:["☁️","Overcast",["#485563","#29323c"]],
  45:["🌫️","Fog",["#606c88","#3f4c6b"]],48:["🌫️","Rime fog",["#606c88","#3f4c6b"]],
  51:["🌦️","Light drizzle",["#4b6cb7","#182848"]],53:["🌦️","Drizzle",["#4b6cb7","#182848"]],55:["🌧️","Heavy drizzle",["#4b6cb7","#182848"]],
  61:["🌧️","Light rain",["#373b44","#4286f4"]],63:["🌧️","Rain",["#373b44","#4286f4"]],65:["🌧️","Heavy rain",["#232526","#414345"]],
  71:["🌨️","Light snow",["#83a4d4","#b6fbff"]],73:["🌨️","Snow",["#83a4d4","#b6fbff"]],75:["❄️","Heavy snow",["#83a4d4","#b6fbff"]],
  80:["🌦️","Rain showers",["#4b6cb7","#182848"]],81:["🌧️","Rain showers",["#373b44","#4286f4"]],82:["⛈️","Violent showers",["#232526","#414345"]],
  95:["⛈️","Thunderstorm",["#1f1c2c","#928dab"]],96:["⛈️","Thunderstorm, hail",["#1f1c2c","#928dab"]],99:["⛈️","Thunderstorm, hail",["#1f1c2c","#928dab"]]
};
const wx = c => WX[c] || WX[Object.keys(WX).reverse().find(k => k <= c)] || WX[0];

/* ---------------- Units (°C/km/h or °F/mph) ---------------- */
let units = store.get("units", "c");
const UNIT = () => units === "c"
  ? {t:"celsius", w:"kmh", wl:"km/h"} : {t:"fahrenheit", w:"mph", wl:"mph"};
const toC = v => units === "c" ? v : (v - 32) * 5 / 9;
const toKmh = v => units === "c" ? v : v * 1.609;
$("unit").textContent = units === "c" ? "°C" : "°F";
$("unit").addEventListener("click", () => {
  units = units === "c" ? "f" : "c";
  store.set("units", units);
  $("unit").textContent = units === "c" ? "°C" : "°F";
  if(cur) load(cur);
});

/* ---------------- City photos: Wikimedia Commons (no key) ---------------- */
const FALLBACK = {
  url: "https://commons.wikimedia.org/wiki/Special:FilePath/MarineDrive_WeekendNight.jpg?width=1280",
  credit: 'Photo: Marine Drive, Mumbai by Indoresearch, <a href="https://commons.wikimedia.org/wiki/File:MarineDrive_WeekendNight.jpg" target="_blank" rel="noopener">Wikimedia Commons</a> (CC BY-SA 3.0)'
};
const strip = h => (h || "").replace(/<[^>]*>/g, "").trim();

async function fetchPhoto(city){
  const key = "photo:" + city.toLowerCase();
  const cached = store.get(key, null);
  if(cached) return cached;
  let photo = null;
  const api = "https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*" +
    "&generator=search&gsrnamespace=6&gsrlimit=10&gsrsearch=" + encodeURIComponent(city + " skyline filetype:bitmap") +
    "&prop=imageinfo&iiprop=url|size|mime|extmetadata&iiurlwidth=1280";
  const d = await getJSON(api, 6000);
  const pages = Object.values((d.query && d.query.pages) || {}).sort((a, b) => a.index - b.index);
  for(const pg of pages){
    const i = pg.imageinfo && pg.imageinfo[0];
    if(i && i.mime === "image/jpeg" && i.width >= 1200 && i.width > i.height * 1.2){
      const m = i.extmetadata || {}, lic = strip(m.LicenseShortName && m.LicenseShortName.value);
      photo = {url: i.thumburl || i.url,
        credit: `Photo: ${esc(strip(m.Artist && m.Artist.value) || "Unknown author")}, <a href="${esc(i.descriptionurl)}" target="_blank" rel="noopener">Wikimedia Commons</a>${lic ? " (" + esc(lic) + ")" : ""}`};
      break;
    }
  }
  if(!photo){
    try{
      const w = await getJSON("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(city), 6000);
      const t = w.thumbnail && w.originalimage && w.originalimage.width >= 1000 ? w.originalimage : null;
      if(t) photo = {url: t.source, credit: `Photo via <a href="${esc(w.content_urls.desktop.page)}" target="_blank" rel="noopener">Wikipedia</a>`};
    }catch(e){}
  }
  if(!photo) return FALLBACK;
  store.set(key, photo);
  return photo;
}

let shownPhoto = "", photoToken = 0;
function showPhoto(photo, onFail){
  if(photo.url === shownPhoto) return;
  const img = new Image();
  img.onload = () => (img.decode ? img.decode().catch(() => {}) : Promise.resolve()).then(() => {
    shownPhoto = photo.url;
    $("bg").style.backgroundImage = 'url("' + photo.url + '")';
    $("bg").classList.add("on");
    $("credit").innerHTML = photo.credit;
    store.set("lastPhoto", photo);
  });
  img.onerror = () => onFail && onFail();
  img.src = photo.url;
}
async function setCityPhoto(city){
  const token = ++photoToken;
  let photo; try{ photo = await fetchPhoto(city); }catch(e){ photo = FALLBACK; }
  if(token !== photoToken) return;           // a newer search replaced this one
  showPhoto(photo, () => showPhoto(FALLBACK));
}
// Show the last photo instantly on startup (before any network call)
showPhoto(store.get("lastPhoto", FALLBACK));

/* ---------------- Data ---------------- */
let cur = null;
async function load(place){
  cur = place;
  msg("Loading…");
  if(place.label !== "Your location") setCityPhoto(place.label.split(",")[0]);   // runs in parallel
  try{
    const u = UNIT(), pos = "latitude=" + place.lat + "&longitude=" + place.lon;
    const wUrl = "https://api.open-meteo.com/v1/forecast?" + pos +
      "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day" +
      "&hourly=temperature_2m,weather_code" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max" +
      "&timezone=auto&forecast_days=7&temperature_unit=" + u.t + "&wind_speed_unit=" + u.w;
    const aUrl = "https://air-quality-api.open-meteo.com/v1/air-quality?" + pos + "&current=us_aqi";
    const [d, a] = await Promise.all([getJSON(wUrl), getJSON(aUrl).catch(() => null)]);
    render(d, a, place.label);
    addRecent(place);
    msg("");
  }catch(e){ msg(e.name === "AbortError" ? "Request timed out. Check your connection." : (e.message || "Could not load weather.")); }
}

const AQI = [[50,"🟢","Good"],[100,"🟡","Moderate"],[150,"🟠","Sensitive"],[200,"🔴","Unhealthy"],[300,"🟣","Very bad"],[1e9,"🟤","Hazardous"]];
const uvLabel = v => v < 3 ? "Low" : v < 6 ? "Moderate" : v < 8 ? "High" : v < 11 ? "Very high" : "Extreme";
const clock = t => new Date(t).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});

function advice(c, day, aqi){
  const tips = [], feel = toC(c.apparent_temperature);
  if((day.precipitation_probability_max[0] || 0) >= 50 || [51,53,55,61,63,65,80,81,82,95,96,99].includes(c.weather_code)) tips.push("☔ Carry an umbrella.");
  if(day.uv_index_max[0] >= 6 && c.is_day) tips.push("🧴 Wear sunscreen, UV is high.");
  if(feel <= 12) tips.push("🧥 Take a jacket.");
  if(feel >= 33) tips.push("💧 Hot out there. Drink plenty of water.");
  if(toKmh(c.wind_speed_10m) >= 40) tips.push("💨 Strong wind today.");
  if(aqi != null && aqi > 100) tips.push("😷 Air quality is poor. Limit time outdoors.");
  return tips.length ? tips.join(" ") : "👍 Conditions look comfortable today.";
}

function render(d, a, label){
  const c = d.current, day = d.daily, [icon, desc, sky] = wx(c.weather_code), u = UNIT();
  document.documentElement.style.setProperty("--sky1", sky[0]);
  document.documentElement.style.setProperty("--sky2", sky[1]);
  $("city").textContent = label;
  $("local").textContent = "Local time " + new Date(Date.now() + d.utc_offset_seconds * 1000)
    .toLocaleTimeString([], {timeZone:"UTC", hour:"numeric", minute:"2-digit"});
  $("icon").textContent = (!c.is_day && c.weather_code < 2) ? "🌙" : icon;
  $("temp").textContent = Math.round(c.temperature_2m) + "°";
  $("desc").textContent = desc;
  $("feels").textContent = Math.round(c.apparent_temperature) + "°";
  $("hum").textContent = c.relative_humidity_2m + "%";
  $("wind").textContent = Math.round(c.wind_speed_10m) + " " + u.wl;
  const uv = day.uv_index_max[0];
  $("uv").textContent = Math.round(uv) + " " + uvLabel(uv);
  const aq = a && a.current && a.current.us_aqi;
  const lvl = aq != null ? AQI.find(x => aq <= x[0]) : null;
  $("aqi").textContent = lvl ? lvl[1] + " " + Math.round(aq) : "n/a";
  $("sun").textContent = clock(day.sunrise[0]) + " / " + clock(day.sunset[0]);
  $("tip").textContent = advice(c, day, aq);

  const start = Math.max(0, d.hourly.time.findIndex(t => t >= c.time));
  $("hours").innerHTML = d.hourly.time.slice(start, start + 24).map((t, i) =>
    `<div class="hour"><div>${i ? new Date(t).toLocaleTimeString([], {hour:"numeric"}) : "Now"}</div>` +
    `<div>${wx(d.hourly.weather_code[start + i])[0]}</div><div>${Math.round(d.hourly.temperature_2m[start + i])}°</div></div>`).join("");
  $("days").innerHTML = day.time.map((t, i) =>
    `<div class="day"><span>${i ? new Date(t + "T00:00").toLocaleDateString([], {weekday:"short"}) : "Today"}</span>` +
    `<span>${wx(day.weather_code[i])[0]}</span><span class="rain">${day.precipitation_probability_max[i] ?? 0}% rain</span>` +
    `<span>${Math.round(day.temperature_2m_max[i])}° <span class="lo">${Math.round(day.temperature_2m_min[i])}°</span></span></div>`).join("");
  $("out").hidden = false;
}

/* ---------------- Recent cities ---------------- */
function addRecent(p){
  if(p.label === "Your location") return;
  const list = [p, ...store.get("recent", []).filter(x => x.label !== p.label)].slice(0, 5);
  store.set("recent", list); drawRecent();
}
function drawRecent(){
  const box = $("recent"); box.innerHTML = "";
  store.get("recent", []).forEach(p => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = p.label.split(",")[0];
    b.title = p.label; b.onclick = () => load(p);
    box.appendChild(b);
  });
}

/* ---------------- Search + suggestions ---------------- */
const placeOf = r => ({lat:r.latitude, lon:r.longitude, label:[r.name, r.admin1, r.country].filter(Boolean).join(", ")});
let suggestions = {}, timer;
$("q").addEventListener("input", () => {
  clearTimeout(timer);
  const q = $("q").value.trim();
  if(q.length < 2) return;
  timer = setTimeout(async () => {
    try{
      const g = await getJSON("https://geocoding-api.open-meteo.com/v1/search?count=6&name=" + encodeURIComponent(q), 5000);
      suggestions = {}; $("sugg").innerHTML = "";
      (g.results || []).forEach(r => {
        const p = placeOf(r); suggestions[p.label] = p;
        const o = document.createElement("option"); o.value = p.label; $("sugg").appendChild(o);
      });
    }catch(e){}
  }, 250);
});
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const q = $("q").value.trim();
  if(!q) return msg("Type a city name first.");
  if(suggestions[q]) return load(suggestions[q]);
  try{
    msg("Searching…");
    const g = await getJSON("https://geocoding-api.open-meteo.com/v1/search?count=1&name=" + encodeURIComponent(q));
    if(!g.results) throw new Error("City not found. Check the spelling and try again.");
    load(placeOf(g.results[0]));
  }catch(err){ msg(err.message); }
});

$("loc").addEventListener("click", () => {
  if(!navigator.geolocation) return msg("Your browser doesn't support location.");
  msg("Finding you…");
  navigator.geolocation.getCurrentPosition(async p => {
    const {latitude:lat, longitude:lon} = p.coords;
    let label = "Your location";
    try{
      const g = await getJSON("https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=en&latitude=" + lat + "&longitude=" + lon, 5000);
      const n = g.city || g.locality;
      if(n) label = [n, g.principalSubdivision, g.countryName].filter(Boolean).join(", ");
    }catch(e){}
    load({lat, lon, label});
  }, () => msg("Location blocked. Allow it in your browser, or search a city."));
});

drawRecent();
load(store.get("lastPlace", null) || (store.get("recent", [])[0]) || {lat:12.9141, lon:74.856, label:"Mangaluru, Karnataka, India"});
</script>
</body>
</html>
